  <style>
    /* splash: shown when opened from the Home Screen, fades out once the first page is ready */
    #splash { position: fixed; inset: 0; z-index: 9999; background: #0B1220; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; transition: opacity .45s cubic-bezier(.22,1,.36,1), transform .45s cubic-bezier(.22,1,.36,1); }
    #splash img { width: 110px; height: 110px; border-radius: 26px; margin-top: -60px; animation: spIn .7s cubic-bezier(.22,1,.36,1) both, spGlow 2.4s ease-in-out .7s infinite; }
    #splash b { font: 700 22px/1 system-ui, -apple-system, "Noto Sans Bengali", sans-serif; color: #EEF2F7; letter-spacing: -.01em; animation: spUp .7s cubic-bezier(.22,1,.36,1) .12s both; }
    #splash small { font: 500 13px/1 system-ui, -apple-system, sans-serif; color: #9AA8BC; animation: spUp .7s cubic-bezier(.22,1,.36,1) .22s both; margin-top: -12px; }
    #splash i { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 56px); width: 120px; height: 3px; border-radius: 3px; background: rgba(148,163,184,.15); overflow: hidden; }
    #splash i::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #22D3EE, #2DD4BF, #4ADE80); animation: spBar 1.1s ease-in-out infinite; }
    #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
    html:not(.standalone) #splash { display: none; }
    @keyframes spIn { from { opacity: 0; transform: scale(.82); } }
    @keyframes spUp { from { opacity: 0; transform: translateY(8px); } }
    @keyframes spGlow { 50% { box-shadow: 0 0 40px rgba(45,212,191,.28); } }
    @keyframes spBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
  </style>
  <script>
    if (matchMedia("(display-mode: standalone)").matches || navigator.standalone === true) document.documentElement.classList.add("standalone");
    // Apple phones already have premium emoji; everyone else gets the same clean Google emoji set
    if (/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)) document.documentElement.classList.add("apple");
  </script>

<body>
  <div id="splash" aria-hidden="true"><img src="assets/icon-192.png" alt=""><b>Amar Lifestyle</b><small>Routine · Money · Discipline</small><i></i></div>
  <script>
    // the splash stays at least a moment (so it doesn't flash) and never longer than 5 s
    (function () { var t0 = Date.now(), done = false;
      window.__splashDone = function () { if (done) return; done = true; var s = document.getElementById("splash"); if (!s) return;
        setTimeout(function () { s.classList.add("out"); setTimeout(function () { s.remove(); }, 500); }, Math.max(0, 900 - (Date.now() - t0))); };
      setTimeout(window.__splashDone, 5000); })();
  </script>
  <main id="app" aria-live="polite"></main>
  <noscript>Please turn on JavaScript to use Amar Lifestyle.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
